# Default local port. On GCP Cloud Run, Google sets PORT (usually 8080) — that overrides this.
server.port=${PORT:8082}
spring.application.name=UserManagement
# Local default. For GCP / Docker prod, set SPRING_PROFILES_ACTIVE=prod (env overrides this).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# One-time SUPER_ADMIN bootstrap (dev + prod). Override via env / GCP Secret Manager.
# Runs only when no SUPER_ADMIN row exists; later secret changes do not update the account.
app.super-admin.enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:true}
app.super-admin.library-id=${SUPER_ADMIN_LIBRARY_ID:MASTER_ADMIN}
app.super-admin.name=${SUPER_ADMIN_NAME:MASTER_ADMIN}
app.super-admin.username=${SUPER_ADMIN_USERNAME:MASTER_ADMIN}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:superadmin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@example.com}

logging.level.root=INFO
logging.level.com.kopibru=INFO
