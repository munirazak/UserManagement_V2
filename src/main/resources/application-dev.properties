# Local development — Neon PostgreSQL.
# Set secrets/host via env, Secret Manager, or a local .env (never commit real values):
#   NEON_HOST, DB_USERNAME, DB_PASSWORD
# Optional full override: DB_URL=jdbc:postgresql://...
# Offline local Postgres: DB_URL=jdbc:postgresql://localhost:5432/book_catalogue

spring.datasource.url=${DB_URL:jdbc:postgresql://${NEON_HOST}/${DB_NAME:book_catalogue}?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Neon is managed — do not attempt CREATE DATABASE; still run schema.sql migrations.
app.schema-bootstrap.enabled=${SCHEMA_BOOTSTRAP_ENABLED:true}
