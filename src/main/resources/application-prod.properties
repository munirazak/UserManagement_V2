# Production profile — Neon PostgreSQL.
# Set at deploy time (Cloud Run / Docker / Secret Manager) — do not commit real values:
#   NEON_HOST, DB_USERNAME, DB_PASSWORD
# Optional full override: DB_URL
#
# Do NOT use localhost for prod. Create the Neon database in the Neon console first.

spring.datasource.url=${DB_URL:jdbc:postgresql://${NEON_HOST}/${DB_NAME:book_catalogue}?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Neon is managed — skip CREATE DATABASE; still run schema.sql (CREATE TABLE IF NOT EXISTS + migrations).
app.schema-bootstrap.enabled=${SCHEMA_BOOTSTRAP_ENABLED:true}
