# UserManagement against Neon PostgreSQL (no local Postgres container).
#
# Required in .env (or shell env) before up:
#   NEON_HOST=ep-....neon.tech
#   DB_PASSWORD=...
#
# Profile:
#   docker compose up --build                         → SPRING_PROFILES_ACTIVE=dev (default)
#   SPRING_PROFILES_ACTIVE=prod docker compose up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usermanagement-app
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: "8082"
      NEON_HOST: ${NEON_HOST}
      DB_NAME: ${DB_NAME:-book_catalogue}
      DB_USERNAME: ${DB_USERNAME:-neondb_owner}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-indexShelf-jwt-secret-key-32chars-min}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SCHEMA_BOOTSTRAP_ENABLED: ${SCHEMA_BOOTSTRAP_ENABLED:-true}
