services:
  postgres:
    image: postgres:16-alpine
    container_name: usermanagement-db
    environment:
      POSTGRES_DB: book_catalogue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Unique host port so this stack can run beside BookManagement / IndexShelf
      - "5434:5432"
    volumes:
      - usermanagement_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_catalogue"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usermanagement-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/book_catalogue
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: indexShelf-jwt-secret-key-32chars-min
      JWT_EXPIRATION_MS: "3600000"

volumes:
  usermanagement_pg_data:
